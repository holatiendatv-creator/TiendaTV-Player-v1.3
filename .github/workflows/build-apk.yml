name: Build & Publish TiendaTV Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build Debug APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish TiendaTV-latest.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.keystore' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK (optional manual dispatch)
        if: ${{ github.event.inputs.build_debug == 'true' }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare TiendaTV-latest.apk
        shell: bash
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TiendaTV-latest.apk
          else
            echo "ERROR: app-release.apk not found!"
            exit 1
          fi
          ls -lh dist/

      - name: Publish / Overwrite Permanent 'latest' GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/TiendaTV-latest.apk --clobber
          else
            gh release create latest dist/TiendaTV-latest.apk \
              --title "TiendaTV Player (Latest)" \
              --notes "Auto-published permanent build for Firestick / Android TV Downloader." \
              --latest
          fi

      - name: Mirror 'latest' Release to Public tiendatv Repo (if PUBLIC_RELEASE_TOKEN is set)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPO: holatiendatv-creator/tiendatv
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PUBLIC_RELEASE_TOKEN not set; skipping mirror to $PUBLIC_REPO."
            exit 0
          fi
          if gh release view latest --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload latest dist/TiendaTV-latest.apk --repo "$PUBLIC_REPO" --clobber
          else
            gh release create latest dist/TiendaTV-latest.apk \
              --repo "$PUBLIC_REPO" \
              --title "TiendaTV Player (Latest)" \
              --notes "Auto-published permanent build for Firestick / Android TV Downloader." \
              --latest
          fi

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiendaTV-latest-APK
          path: dist/TiendaTV-latest.apk
          retention-days: 14
